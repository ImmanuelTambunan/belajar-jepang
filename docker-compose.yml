services:
  # 1. Backend PHP 8.3 FPM
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nihongo_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    networks:
      - nihongo_network
    depends_on:
      db_mysql:
        condition: service_healthy

  # 2. Web Server Nginx (Reverse Proxy for Laravel API)
  nginx:
    image: nginx:alpine
    container_name: nihongo_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nihongo_network
    depends_on:
      - app

  # 3. Database MySQL 8.0
  db_mysql:
    image: mysql:8.0
    container_name: nihongo_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: belajar_jepang
      MYSQL_USER: jepang_user
      MYSQL_PASSWORD: jepang_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - nihongo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 4. Frontend Vite + React + TypeScript Dev Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nihongo_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - nihongo_network
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data:
    driver: local

networks:
  nihongo_network:
    driver: bridge
