<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Sora - Multi-App Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f9ff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .page-transition { transition: all 0.3s ease-in-out; }
        .hidden { display: none; }
        .active-nav { color: #0ea5e9; transform: scale(1.1); }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.1); }
    </style>
</head>
<body class="pb-24">

    <!-- TOP BAR -->
    <nav class="fixed top-0 w-full glass z-50 border-b border-sora-100 p-4 flex justify-between items-center">
        <h1 class="font-black text-xl text-sky-800 tracking-tighter">Nihongo <span class="text-sky-500">Sora</span></h1>
        <div class="bg-sky-100 text-sky-600 text-[10px] font-bold px-3 py-1 rounded-full uppercase">IT DEL v2.0</div>
    </nav>

    <div class="max-w-xl mx-auto px-6 pt-24 min-h-screen">
        
        <!-- PAGE 1: HOME -->
        <div id="page-home" class="page-transition">
            <div class="mb-8">
                <h2 class="text-3xl font-extrabold text-slate-800">Halo, Immanuel! 👋</h2>
                <p class="text-slate-500 mt-1">Apa yang ingin kamu pelajari hari ini?</p>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <!-- Card 1 -->
                <button onclick="navigate('kana')" class="bg-white p-6 rounded-[2rem] border border-sky-100 flex items-center card-hover transition-all text-left">
                    <div class="w-14 h-14 bg-sky-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-sky-200 mr-5">
                        <i class="fas fa-th-large"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800">Kana Master</h4>
                        <p class="text-xs text-slate-500">Latih hafalan Hiragana & Katakana</p>
                    </div>
                </button>

                <!-- Card 2 -->
                <button onclick="navigate('jurnal')" class="bg-white p-6 rounded-[2rem] border border-sky-100 flex items-center card-hover transition-all text-left">
                    <div class="w-14 h-14 bg-indigo-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-200 mr-5">
                        <i class="fas fa-book"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800">Jurnal Kosa Kata</h4>
                        <p class="text-xs text-slate-500">Kelola daftar kata yang sudah dipelajari</p>
                    </div>
                </button>

                <!-- Card 3 -->
                <button onclick="navigate('stats')" class="bg-white p-6 rounded-[2rem] border border-sky-100 flex items-center card-hover transition-all text-left">
                    <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-emerald-200 mr-5">
                        <i class="fas fa-chart-pie"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800">Statistik Belajar</h4>
                        <p class="text-xs text-slate-500">Pantau progres penguasaanmu</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- PAGE 2: KANA MASTER -->
        <div id="page-kana" class="page-transition hidden">
            <button onclick="navigate('home')" class="mb-6 text-sky-600 font-bold flex items-center"><i class="fas fa-arrow-left mr-2"></i> Kembali</button>
            <h2 class="text-2xl font-black text-slate-800 mb-6 italic">Mastering <span class="text-sky-500">Kana</span></h2>
            
            <div class="flex space-x-2 bg-white p-2 rounded-2xl shadow-sm border border-sky-50 mb-6">
                <button onclick="setKana('hira')" id="btnHira" class="flex-1 py-2 rounded-xl font-bold bg-sky-500 text-white transition-all">Hiragana</button>
                <button onclick="setKana('kata')" id="btnKata" class="flex-1 py-2 rounded-xl font-bold text-sky-400 transition-all">Katakana</button>
            </div>

            <div id="kanaGrid" class="grid grid-cols-5 gap-3 bg-white p-6 rounded-3xl border border-sky-100"></div>
        </div>

        <!-- PAGE 3: JURNAL -->
        <div id="page-jurnal" class="page-transition hidden">
            <button onclick="navigate('home')" class="mb-6 text-sky-600 font-bold flex items-center"><i class="fas fa-arrow-left mr-2"></i> Kembali</button>
            <h2 class="text-2xl font-black text-slate-800 mb-6">Personal <span class="text-indigo-500">Dictionary</span></h2>
            
            <div class="bg-white p-6 rounded-3xl border border-indigo-50 mb-8">
                <input id="inJp" type="text" placeholder="Jepang..." class="w-full mb-3 p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-200">
                <input id="inId" type="text" placeholder="Arti..." class="w-full mb-4 p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-200">
                <button onclick="saveWord()" class="w-full bg-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100">Simpan Kata 📔</button>
            </div>

            <div id="wordList" class="space-y-3"></div>
        </div>

        <!-- PAGE 4: STATS -->
        <div id="page-stats" class="page-transition hidden text-center">
            <button onclick="navigate('home')" class="mb-6 text-sky-600 font-bold flex items-center"><i class="fas fa-arrow-left mr-2"></i> Kembali</button>
            <h2 class="text-2xl font-black text-slate-800 mb-10 text-left">Your <span class="text-emerald-500">Analytics</span></h2>
            
            <div class="grid grid-cols-1 gap-6">
                <div class="bg-white p-10 rounded-[3rem] border border-emerald-50">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Kosa Kata Terkumpul</p>
                    <h3 id="statWord" class="text-6xl font-black text-slate-800">0</h3>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-sky-500 p-8 rounded-[2.5rem] text-white">
                        <p class="text-[10px] font-bold uppercase opacity-80 mb-1">Hiragana</p>
                        <h4 id="statHira" class="text-3xl font-black">0%</h4>
                    </div>
                    <div class="bg-indigo-500 p-8 rounded-[2.5rem] text-white">
                        <p class="text-[10px] font-bold uppercase opacity-80 mb-1">Katakana</p>
                        <h4 id="statKata" class="text-3xl font-black">0%</h4>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVBAR -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[85%] max-w-sm glass rounded-full p-2 flex justify-around shadow-2xl border border-white/50">
        <button onclick="navigate('home')" id="nav-home" class="w-12 h-12 flex items-center justify-center text-xl active-nav"><i class="fas fa-house"></i></button>
        <button onclick="navigate('kana')" id="nav-kana" class="w-12 h-12 flex items-center justify-center text-xl text-slate-300"><i class="fas fa-th-large"></i></button>
        <button onclick="navigate('jurnal')" id="nav-jurnal" class="w-12 h-12 flex items-center justify-center text-xl text-slate-300"><i class="fas fa-book"></i></button>
        <button onclick="navigate('stats')" id="nav-stats" class="w-12 h-12 flex items-center justify-center text-xl text-slate-300"><i class="fas fa-chart-pie"></i></button>
    </nav>

    <script>
        // LOGIC ROUTING
        function navigate(pageId) {
            ['home', 'kana', 'jurnal', 'stats'].forEach(p => {
                document.getElementById('page-' + p).classList.add('hidden');
                document.getElementById('nav-' + p).classList.remove('active-nav', 'text-sky-500');
                document.getElementById('nav-' + p).classList.add('text-slate-300');
            });
            document.getElementById('page-' + pageId).classList.remove('hidden');
            document.getElementById('nav-' + pageId).classList.add('active-nav');
            
            if(pageId === 'kana') renderKana();
            if(pageId === 'jurnal') renderWords();
            if(pageId === 'stats') updateStats();
        }

        // KANA LOGIC
        const hList = ["あ","い","う","え","お","か","き","く","け","こ"];
        const kList = ["ア","イ","ウ","エ","オ","カ","キ","ク","KE","KO"];
        let currentKana = 'hira';
        let storage = JSON.parse(localStorage.getItem('soraData') || '{"words":[], "kana":{}}');

        function setKana(type) {
            currentKana = type;
            document.getElementById('btnHira').className = type === 'hira' ? 'flex-1 py-2 rounded-xl font-bold bg-sky-500 text-white' : 'flex-1 py-2 rounded-xl font-bold text-sky-400';
            document.getElementById('btnKata').className = type === 'kata' ? 'flex-1 py-2 rounded-xl font-bold bg-sky-500 text-white' : 'flex-1 py-2 rounded-xl font-bold text-sky-400';
            renderKana();
        }

        function renderKana() {
            const grid = document.getElementById('kanaGrid');
            grid.innerHTML = '';
            const list = currentKana === 'hira' ? hList : kList;
            list.forEach(c => {
                const status = storage.kana[c] || 0;
                let color = 'bg-slate-50 text-slate-300 border border-slate-100';
                if(status === 2) color = 'bg-sky-100 text-sky-600 border-sky-200';
                grid.innerHTML += `<button onclick="toggle('${c}')" class="${color} h-12 rounded-xl font-bold text-lg">${c}</button>`;
            });
        }

        function toggle(c) {
            storage.kana[c] = (storage.kana[c] === 2) ? 0 : 2;
            save(); renderKana();
        }

        // JURNAL LOGIC
        function saveWord() {
            const jp = document.getElementById('inJp').value;
            const id = document.getElementById('inId').value;
            if(jp && id) {
                storage.words.push({jp, id});
                save(); renderWords();
                document.getElementById('inJp').value = '';
                document.getElementById('inId').value = '';
            }
        }

        function renderWords() {
            const list = document.getElementById('wordList');
            list.innerHTML = storage.words.map((w, i) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between border border-slate-100">
                    <div><p class="font-bold text-slate-800">${w.jp}</p><p class="text-xs text-slate-400">${w.id}</p></div>
                    <button onclick="delWord(${i})" class="text-slate-200 hover:text-red-400"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function delWord(i) { storage.words.splice(i,1); save(); renderWords(); }

        // STATS LOGIC
        function updateStats() {
            document.getElementById('statWord').innerText = storage.words.length;
            const mH = hList.filter(c => storage.kana[c] === 2).length;
            document.getElementById('statHira').innerText = Math.round((mH/hList.length)*100) + "%";
            const mK = kList.filter(c => storage.kana[c] === 2).length;
            document.getElementById('statKata').innerText = Math.round((mK/kList.length)*100) + "%";
        }

        function save() { localStorage.setItem('soraData', JSON.stringify(storage)); }
        
        // Init
        navigate('home');
    </script>
</body>
</html>
