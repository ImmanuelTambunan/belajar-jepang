<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo Sakura - Dashboard Immanuel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sakura-bg { background: linear-gradient(135deg, #ffd1dc 0%, #ffafbd 100%); }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(251, 113, 133, 0.2); }
    </style>
</head>
<body class="pb-32">
    <div class="max-w-2xl mx-auto p-6">
        <!-- Header -->
        <header class="text-center mb-10 pt-4">
            <h1 class="text-4xl font-extrabold text-rose-600 mb-2">🌸 Nihongo Sakura</h1>
            <p class="text-rose-400 font-medium italic">Ganbatte, Immanuel-san!</p>
        </header>

        <!-- Stats Dashboard -->
        <div class="sakura-bg p-8 rounded-[2rem] shadow-xl mb-10 text-white card-shadow border-4 border-white/50">
            <h2 class="font-bold mb-6 text-xl flex items-center"><i class="fas fa-seedling mr-3"></i> Progres Belajar</h2>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-white/20 p-4 rounded-3xl backdrop-blur-sm">
                    <p class="text-[10px] uppercase tracking-widest opacity-90 mb-1">Kosa Kata</p>
                    <p id="wordCount" class="text-3xl font-black text-white">0</p>
                </div>
                <div class="bg-white/20 p-4 rounded-3xl backdrop-blur-sm">
                    <p class="text-[10px] uppercase tracking-widest opacity-90 mb-1">Hiragana</p>
                    <p id="hiraCount" class="text-3xl font-black text-white">0%</p>
                </div>
                <div class="bg-white/20 p-4 rounded-3xl backdrop-blur-sm">
                    <p class="text-[10px] uppercase tracking-widest opacity-90 mb-1">Katakana</p>
                    <p id="kataCount" class="text-3xl font-black text-white">0%</p>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-8 rounded-[2rem] card-shadow mb-12 border border-rose-50">
            <h3 class="font-bold text-rose-600 mb-6 text-sm uppercase tracking-[0.2em] flex items-center">
                <i class="fas fa-plus-circle mr-2"></i> Tambah Partikel Baru
            </h3>
            <div class="space-y-4">
                <input id="jpWord" type="text" placeholder="Jepang (Contoh: 私 / わたし)" class="w-full p-4 bg-rose-50 border-none rounded-2xl focus:ring-2 focus:ring-rose-300 transition-all outline-none">
                <input id="idWord" type="text" placeholder="Arti (Contoh: Saya)" class="w-full p-4 bg-rose-50 border-none rounded-2xl focus:ring-2 focus:ring-rose-300 transition-all outline-none">
                <button onclick="addWord()" class="w-full sakura-bg text-white font-bold py-4 rounded-2xl shadow-lg hover:opacity-90 active:scale-95 transition-all text-lg">
                    Simpan ke List 🌸
                </button>
            </div>
        </div>

        <!-- Kana Mastery Section -->
        <div class="mb-12">
            <h3 class="font-bold text-rose-800 mb-6 flex items-center px-2">
                <i class="fas fa-th-large mr-2"></i> Penguasaan Karakter
            </h3>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="showSection('hiragana')" class="p-4 bg-white rounded-2xl shadow-sm text-rose-600 font-bold border-b-4 border-rose-300 active:translate-y-1 transition-all">Hiragana</button>
                <button onclick="showSection('katakana')" class="p-4 bg-white rounded-2xl shadow-sm text-rose-600 font-bold border-b-4 border-rose-300 active:translate-y-1 transition-all">Katakana</button>
            </div>
            
            <!-- Kana Grid -->
            <div id="kanaGrid" class="grid grid-cols-5 gap-3 bg-white p-6 rounded-[2rem] shadow-sm border border-rose-50">
                <!-- Grid diisi via JS -->
            </div>
            <p class="text-[10px] text-gray-400 mt-4 text-center italic">Klik kotak: Abu (Belum), Kuning (Setengah), Hijau (Hafal)</p>
        </div>

        <!-- Vocabulary List -->
        <div class="mb-12">
            <h3 class="font-bold text-rose-800 mb-6 px-2 flex items-center">
                <i class="fas fa-list mr-2"></i> Jurnal Kosa Kata
            </h3>
            <div id="wordList" class="space-y-4"></div>
        </div>
    </div>

    <!-- Floating Navbar -->
    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[85%] max-w-md glass border border-white/50 rounded-full p-3 flex justify-around shadow-2xl z-50 card-shadow">
        <button class="text-rose-500 w-12 h-12 bg-white rounded-full shadow-md transition-all scale-110"><i class="fas fa-home"></i></button>
        <button class="text-rose-300 w-12 h-12 hover:text-rose-500 transition-all"><i class="fas fa-calendar-alt"></i></button>
        <button class="text-rose-300 w-12 h-12 hover:text-rose-500 transition-all"><i class="fas fa-medal"></i></button>
    </nav>

    <script>
        // Data Hiragana Sederhana
        const hiraganaList = ["あ","い","う","え","お","か","き","く","け","こ","さ","し","す","せ","そ"];
        const katakanaList = ["ア","イ","ウ","エ","オ","カ","キ","ク","ケ","コ","サ","シ","ス","セ","ソ"];
        
        let words = JSON.parse(localStorage.getItem('sakuraWords') || '[]');
        let kanaStatus = JSON.parse(localStorage.getItem('sakuraKana') || '{}');
        let currentMode = 'hiragana';

        function showSection(mode) {
            currentMode = mode;
            renderKana();
        }

        function renderKana() {
            const grid = document.getElementById('kanaGrid');
            grid.innerHTML = '';
            const list = currentMode === 'hiragana' ? hiraganaList : katakanaList;
            
            list.forEach(char => {
                const status = kanaStatus[char] || 0; // 0: none, 1: half, 2: master
                let color = 'bg-gray-100 text-gray-400';
                if(status === 1) color = 'bg-yellow-100 text-yellow-600 border-yellow-200';
                if(status === 2) color = 'bg-green-100 text-green-600 border-green-200 border-2';

                grid.innerHTML += `
                    <button onclick="toggleKana('${char}')" class="${color} h-12 w-full rounded-xl font-bold transition-all flex items-center justify-center shadow-sm">
                        ${char}
                    </button>
                `;
            });
            updateStats();
        }

        function toggleKana(char) {
            let status = kanaStatus[char] || 0;
            kanaStatus[char] = (status + 1) % 3;
            localStorage.setItem('sakuraKana', JSON.stringify(kanaStatus));
            renderKana();
        }

        function updateStats() {
            document.getElementById('wordCount').innerText = words.length;
            const masteredH = hiraganaList.filter(c => kanaStatus[c] === 2).length;
            document.getElementById('hiraCount').innerText = Math.round((masteredH / hiraganaList.length) * 100) + "%";
            
            const masteredK = katakanaList.filter(c => kanaStatus[c] === 2).length;
            document.getElementById('kataCount').innerText = Math.round((masteredK / katakanaList.length) * 100) + "%";
        }

        function updateWordUI() {
            const list = document.getElementById('wordList');
            list.innerHTML = '';
            words.reverse().forEach((w, index) => {
                list.innerHTML += `
                    <div class="bg-white p-5 rounded-3xl flex justify-between items-center shadow-sm border border-rose-50 hover:border-rose-200 transition-all group">
                        <div>
                            <p class="font-black text-xl text-rose-700">${w.jp}</p>
                            <p class="text-sm text-gray-500 font-medium">${w.id}</p>
                        </div>
                        <button onclick="deleteWord(${words.length - 1 - index})" class="text-gray-200 group-hover:text-rose-400 transition-colors p-2">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            words.reverse(); // Balikkan kembali
            updateStats();
        }

        function addWord() {
            const jp = document.getElementById('jpWord').value;
            const id = document.getElementById('idWord').value;
            if (jp && id) {
                words.push({ jp, id });
                localStorage.setItem('sakuraWords', JSON.stringify(words));
                document.getElementById('jpWord').value = '';
                document.getElementById('idWord').value = '';
                updateWordUI();
            }
        }

        function deleteWord(index) {
            words.splice(index, 1);
            localStorage.setItem('sakuraWords', JSON.stringify(words));
            updateWordUI();
        }

        // Jalankan saat pertama buka
        renderKana();
        updateWordUI();
    </script>
</body>
</html>
